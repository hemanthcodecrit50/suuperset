[project]
name = "placement-intelligence"
version = "0.1.0"
description = "Superset campus placement intelligence system"
requires-python = ">=3.11"

[tool.setuptools]
packages = [
    "app",
    "app.agent",
    "app.collector",
    "app.jobs",
    "app.services",
    "app.ui",
    "app.web",
    "scripts",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
